name: Build Cloudstream VIP
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Izinkan gradlew
        run: chmod +x ./gradlew

      # Cek nama task yang benar di fork Anda: ./gradlew tasks --all | grep assemble
      - name: Build release
        run: ./gradlew assemblePrereleaseRelease --no-daemon

      - name: Daftar APK hasil build
        run: find app/build/outputs/apk -name "*.apk" -ls

      - name: Sign APK
        run: |
          echo "${{ secrets.KS_BASE64 }}" | base64 -d > vip.jks
          APK=$(find app/build/outputs/apk -name "*.apk" | sort | head -n1)
          echo "APK dipilih: $APK"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n1)
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 "$APK" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks vip.jks --ks-key-alias vipkey \
            --ks-pass pass:${{ secrets.KS_PASS }} \
            --out CloudstreamVIP-signed.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudstreamVIP-signed
          path: CloudstreamVIP-signed.apk
