name: Archive build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "Archive-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Keystore milik sendiri (secret KS_BASE64 dan KS_PASS)
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KS_BASE64 }}
      run: |
        TMP_KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
        mkdir -p "${TMP_KEYSTORE_DIR}"
        echo "${KEYSTORE_BASE64}" | base64 -d > "${TMP_KEYSTORE_DIR}/prerelease_keystore.keystore"

    # Alias dibaca otomatis dari keystore
    - name: Detect key alias
      env:
        KS_PASS: ${{ secrets.KS_PASS }}
      run: |
        KS="${RUNNER_TEMP}/keystore/prerelease_keystore.keystore"
        ALIAS=$(keytool -list -keystore "$KS" -storepass "$KS_PASS" 2>/dev/null | grep -m1 "PrivateKeyEntry" | cut -d, -f1)
        if [ -z "$ALIAS" ]; then
          echo "Alias tidak ditemukan. Periksa KS_BASE64 dan KS_PASS."
          exit 1
        fi
        echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseRelease
      env:
        SIGNING_KEY_ALIAS: ${{ env.KEY_ALIAS }}
        SIGNING_KEY_PASSWORD: ${{ secrets.KS_PASS }}
        SIGNING_STORE_PASSWORD: ${{ secrets.KS_PASS }}
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    - name: Name the build
      id: build_name
      run: echo "name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    # Arsip disimpan sebagai artifact di repo ini (bukan di repo recloudstream)
    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: cloudstream-${{ steps.build_name.outputs.name }}
        path: app/build/outputs/apk/prerelease/release/*.apk
        retention-days: 30
        if-no-files-found: error
