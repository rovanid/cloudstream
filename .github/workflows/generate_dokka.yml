name: Dokka

# Dijalankan manual saja (tombol "Run workflow"), tidak setiap push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "dokka"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Generate Dokka
        run: |
          chmod +x gradlew
          ./gradlew docs:dokkaGeneratePublicationHtml

      # Dokumentasi disimpan sebagai artifact (bukan dikirim ke repo recloudstream)
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: dokka-html
          path: docs/build/dokka/html
          retention-days: 14
          if-no-files-found: error
