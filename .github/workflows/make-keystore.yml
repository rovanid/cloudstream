# Jalankan SEKALI untuk membuat keystore. Hasilnya: teks Base64 di artifact.
# SIMPAN keystore-nya baik-baik: kalau hilang, APK baru tidak bisa menimpa (update) APK lama.
name: Make Keystore
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore vip.jks -alias vipkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KS_PASS }}" -keypass "${{ secrets.KS_PASS }}" \
            -dname "CN=Cloudstream VIP, O=Cloudstream VIP, C=ID"
          base64 -w0 vip.jks > vip.jks.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: vip.jks.b64
          retention-days: 1
